version: 1
seed: 42
device: cuda:0

# One environment step advances both robots, so this is the number of arenas,
# not the 49,152 simultaneous red+blue agent instances. Each of the two
# independent CPO populations has six 4,096-arena coefficient blocks.
num_envs: 24576
# 2,560 exact rollout updates (24,576 arenas x 16 transitions per update).
total_environment_steps: 1006632960
rollout_steps: 16

learning_rate: 0.0003
update_epochs: 4
minibatch_size: 32768
gamma: 0.995
gae_lambda: 0.95
value_coefficient: 0.5
entropy_coefficient: 0.001
leader_awac_coefficient: 0.10
leader_awac_temperature: 1.0
leader_awac_max_weight: 20.0
max_grad_norm: 1.0

checkpoint_every_updates: 10
validation_every_updates: 10
validation_envs: 16
validation_seed: 2026
validation_video_fps: 5
# Initial frame plus 30 seconds at 5 fps. The validator rejects a cap that
# would truncate the match before its terminal frame.
validation_video_max_frames: 151
